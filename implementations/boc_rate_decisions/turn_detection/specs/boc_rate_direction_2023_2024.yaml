# BoC Rate Direction — 2023-2024 replication window, T-28
#
# The 14 fixed announcements from April 2023 through December 2024, scored at
# the canonical 28-day lead. Used by turn_detection/ to replicate the A3 finding
# (market worst on holds, best on moves) on a window no result had been seen on.
#
# The window starts in April 2023 because One-Month CORRA futures (COA) only
# begin trading in early 2023; the 2023-01-25 and 2023-03-08 announcements have
# no futures quote 28 days earlier.
#
# LLM arms must NOT be scored here: the models in use were trained on text
# covering these decisions. Only the market, the macro logistic and climatology
# are valid on this window.
#
# Outcomes: 7 holds, 5 cuts (two of them 50 bp), 2 hikes.

spec_id: boc_rate_direction_2023_2024

description: >-
  Replication window across the 14 BoC fixed announcement dates from April
  2023 through December 2024. At each origin (announcement date minus 28 days)
  predictors emit probabilities over cut, hold, and hike, scored with RPS.
  Cutoff-safe arms only.

task:
  task_id: boc_rate_direction_next_meeting
  target_series_id: boc_rate_decision_direction
  horizons: [28]
  frequency: D
  payload_type: categorical
  categories:
    - {label: cut, value: -1}
    - {label: hold, value: 0}
    - {label: hike, value: 1}
  description: >-
    At the Bank of Canada fixed announcement date occurring 28 days after the
    forecast origin, will the Bank CUT, HOLD, or HIKE its target for the
    overnight rate? Outcome is the direction of the target-rate change at
    that announcement (any size).

start: "2023-03-01"
end: "2024-12-31"
stride: 1
warmup: 8

origin_dates:
  - "2023-03-15"  # meeting 2023-04-12
  - "2023-05-10"  # meeting 2023-06-07 (hike)
  - "2023-06-14"  # meeting 2023-07-12 (hike)
  - "2023-08-09"  # meeting 2023-09-06
  - "2023-09-27"  # meeting 2023-10-25
  - "2023-11-08"  # meeting 2023-12-06
  - "2023-12-27"  # meeting 2024-01-24
  - "2024-02-07"  # meeting 2024-03-06
  - "2024-03-13"  # meeting 2024-04-10
  - "2024-05-08"  # meeting 2024-06-05 (cut)
  - "2024-06-26"  # meeting 2024-07-24 (cut)
  - "2024-08-07"  # meeting 2024-09-04 (cut)
  - "2024-09-25"  # meeting 2024-10-23 (cut, 50 bp)
  - "2024-11-13"  # meeting 2024-12-11 (cut, 50 bp)
