      horizons upward to align with the new spot level of ~$72/bbl. The rationales
      reflect the tension between mean-reversion (due to comfortable supply buffers)
      and the persistence of this new risk premium, along with higher uncertainty
      due to the volatility breakout.
    horizon_rationale: '1. Case BELOW extrapolation: The sudden weekend surge to $72/bbl
      on March 1 could be a short-term speculative reaction, with comfortable supply
      buffers and seasonal demand weakness from February dragging prices back down
      toward the $66.97 point forecast. 2. Case ABOVE: WTI has already surged over
      8% over the weekend to $72/bbl, establishing strong upward momentum and a new
      price floor well above the extrapolation. 3. Comparison: The bullish case is
      significantly stronger because the $72/bbl price has already materialized, justifying
      a signal_loc of +0.73 to align the forecast with the new spot level. The sudden
      breakout also increases near-term volatility, prompting a signal_width of 0.30.'
