      characterized by three consecutive weeks of US crude inventory builds and record-high
      global inventories. While geopolitical tensions (Venezuelan tanker seizure,
      strikes on Russian infrastructure) provide occasional volatility, they have
      consistently failed to drive sustained price appreciation, serving only to cap
