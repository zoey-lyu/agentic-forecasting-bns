      is the persistent buildup in US crude inventories (3 consecutive weeks) and
      the IEA's report of four-year record highs in global inventories. The strongest
      case for prices landing above is the ongoing geopolitical volatility, including
      threats to Russian energy infrastructure and the seizure of a Venezuelan tanker,
      which provides a marginal floor. The bearish case is stronger, as supply-demand
      fundamentals and inventory growth are currently dictating price action more
      heavily than intermittent geopolitical risk premiums, which have failed to generate
      sustained rallies.
