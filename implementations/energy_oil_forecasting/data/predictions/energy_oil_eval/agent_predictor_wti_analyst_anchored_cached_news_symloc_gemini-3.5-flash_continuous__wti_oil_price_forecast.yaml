      premium and physical supply tightness following the Strait of Hormuz blockade,
      which has shut in approximately 10 million bpd of Gulf production (including
      a 60% cut in Iraqi output). Although the IEA announced a record 400-million-barrel
      emergency stockpile release on March 11, S&P Global CERA notes that the March
      supply deficit of 430 million barrels exceeds this temporary stop-gap. With
      Iran's Mojtaba Khamenei declaring on March 12 that the blockade will remain,
      upward price pressure will persist over the next week, targeting the $101-$102
      range. However, the extreme intraday swings seen recently (e.g., the flash crash
      on March 10) require a significant expansion of the uncertainty interval compared
      to the ARIMA baseline.
