      or localized containment of the Middle East conflict, combined with rapid profit-taking
      by speculative longs who rode the massive $24/bbl run-up over the past week
      (from $67 to $91). Geopolitical spikes often see a brief cooling-off period
      if physical infrastructure remains undamaged. 2. Strongest case ABOVE: A direct
      expansion of the conflict, such as immediate retaliatory strikes on oil production
      or refining facilities, or shipping incidents in key transit routes, pushing
      prices toward $100. 3. Comparison: While upward momentum is strong, the vertical
      nature of the jump ($67 to $91 in a week, with a $10 spike on the final day)
      makes the price highly vulnerable to near-term consolidation or minor retracement.
      The extrapolation is near the very peak of the spike, so we lean slightly negative
      on the location (-0.10). Uncertainty is extremely elevated compared to historical
      averages, requiring a wide interval adjustment (+0.60).'
