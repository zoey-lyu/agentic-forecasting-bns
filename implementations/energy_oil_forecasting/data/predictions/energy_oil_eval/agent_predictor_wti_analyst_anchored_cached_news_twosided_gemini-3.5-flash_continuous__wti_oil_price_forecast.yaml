    rationale: The short-term and medium-term outlooks for WTI crude oil are structurally
      supported by OPEC+'s tight management (extending the pause on hikes through
      March) and an elevated geopolitical risk premium stemming from US-Iran tensions.
      While temporary supply shocks (Winter Storm Fern and Kazakhstan's Tengiz field
      fire) will gradually resolve over the 21-day horizon, the underlying fundamentals
      of low US inventories and a weak US dollar keep the bias tilted to the upside
      relative to mechanical extrapolations.
    horizon_rationale: '1. Strongest bearish case: The immediate physical disruptions
      from Winter Storm Fern begin to normalize, restoring frozen US shale production
      and Gulf Coast export flows while cooling the acute spike in heating-driven
      oil-fired power generation. 2. Strongest bullish case: OPEC+ is highly likely
      to confirm a continuation of its production increase pause through March, supported
      by a weak US dollar at a four-year low, an EIA crude inventory draw of 2.3 million
      barrels (leaving stockpiles 3% below the five-year average), and escalating
      US-Iran tensions. 3. Comparison: The bullish case is stronger because the combination
      of a prolonged OPEC+ output freeze, tight inventories, and active geopolitical
      risk premium over the Strait of Hormuz outweighs the gradual recovery from the
      winter storm, pointing to prices landing above the flat extrapolation.'
    key_signals:
    - OPEC+ virtual meeting decision to maintain production hike pause through March
    - US-Iran geopolitical tensions and potential threats to the Strait of Hormuz
    - EIA US crude inventory draw of 2.3 million barrels
    - Resolution of temporary production freezes from Winter Storm Fern and the Tengiz
      oilfield fire
