      this momentum, projecting prices to remain near $91 across all horizons. However,
      historical precedent shows that rapid geopolitical risk-premium spikes without
      immediate physical oil supply disruptions are highly prone to mean-reversion.
      Thus, we project a negative location bias (downward drift from the extrapolation)
      at all horizons, combined with significantly increased interval widths to account
      for the extreme, fat-tailed uncertainty of war escalation versus diplomatic
      resolution.
