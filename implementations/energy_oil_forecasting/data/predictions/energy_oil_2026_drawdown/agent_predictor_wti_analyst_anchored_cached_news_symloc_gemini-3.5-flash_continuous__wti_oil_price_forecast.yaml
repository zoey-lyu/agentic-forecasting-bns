      tight framework to a demand-capped, fundamentals-driven oversupply. The signing
      of a 60-day US-Iran ceasefire has effectively removed the war premium, while
      OPEC+ persists in unwinding production cuts. These structural changes warrant
      a significant negative location signal across all horizons to reflect a price
      target trend heading into the key $57-$65 support range.
    horizon_rationale: WTI is on a clear downward trajectory as the geopolitical war
      premium continues to unwind following the mid-June US-Iran ceasefire framework.
      Over the next week, the gradual return of shipping through the Strait of Hormuz,
      coupled with the latest July OPEC+ quota hike of 188,000 bpd, is expected to
      pull prices down below the flat statistical anchor to around $66.50.
    key_signals:
    - US-Iran 60-day ceasefire framework and the reopening of the Strait of Hormuz.
    - OPEC+ July quota increase of 188,000 bpd, bringing the cumulative increase since
      April to 600,000 bpd.
    - IEA's demand growth downgrade of 700,000 bpd to 1.1 million bpd for 2026.
    - WTI testing the critical long-term support zone of $57 to $65 per barrel.
