    rationale: The forecast incorporates the fundamental reality that global oil supply
      has been physically crippled by the Strait of Hormuz closure. While statistical
      models suggest a mean-reverting path, the physical data (OPEC production hitting
      25-year lows and accelerating inventory draws) suggests the baseline is overly
      optimistic. I have applied a positive drift to reflect the supply premium and
      increased the width to account for the binary risk of geopolitical escalation
      or an unforeseen diplomatic breakthrough.
    horizon_rationale: The market is reacting to the stark disconnect between quota
      increases and the reality of production declines due to the Strait of Hormuz
      closure. While the statistical anchor provides a baseline, the extreme physical
      supply constraints (lowest OPEC production since 2000) and the threat of depletion
      suggest a higher risk of upward price volatility than the model captures.
    key_signals:
    - OPEC+ May crude production fell to lowest level since 2000 (33.13 million bpd).
    - Global oil inventory draw rates averaging 6.3 million bpd (Q2) and 7.6 million
      bpd (Q3 projected).
    - Strait of Hormuz closure remains the dominant structural supply constraint.
    - OECD oil inventories at lowest levels since 2003.
