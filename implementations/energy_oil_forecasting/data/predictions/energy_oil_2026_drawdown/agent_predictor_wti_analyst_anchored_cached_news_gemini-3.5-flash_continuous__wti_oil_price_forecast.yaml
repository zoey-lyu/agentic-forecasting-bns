      following the unwinding of the geopolitical risk premium after the mid-June
      US-Iran ceasefire. The prompt supply increases from OPEC+ (+188k bpd for July)
      and weak US/Chinese industrial indicators provide near-term downward pressure.
      A slight negative drift (signal_loc = -0.10) is applied, with a minor increase
      in uncertainty (signal_width = 0.05) to account for short-term shipping bottlenecks
      in the Strait of Hormuz as demining and insurance adjustments proceed.
