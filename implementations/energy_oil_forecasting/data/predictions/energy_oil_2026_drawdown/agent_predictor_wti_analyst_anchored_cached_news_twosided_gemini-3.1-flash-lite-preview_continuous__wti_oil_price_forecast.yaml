    rationale: The WTI market is undergoing a significant regime shift. The primary
      driver is the rapid compression of the geopolitical risk premium after the reopening
      of the Strait of Hormuz. We are also seeing a fundamental pivot where major
      agencies (IEA/EIA) have substantially downgraded demand forecasts, transitioning
      the narrative from supply shortage to potential surplus as Gulf production normalizes.
      While there are bullish tailwinds regarding long-term sector underinvestment
      and potential operational delays in restoring flows, these are currently secondary
      to the bearish momentum of price normalization from peak-crisis levels.
    horizon_rationale: The strongest bearish factor is the rapid evaporation of the
      Middle East geopolitical risk premium following the U.S.-Iran ceasefire and
      the reopening of the Strait of Hormuz, shifting the market from supply-scarcity
      panic to concerns about fundamental supply normalisation. The strongest bullish
      factor is the IEA's warning that structural constraints, such as demining and
      transit operational hurdles, could delay the full return of Iranian production,
      providing a minor floor. The bearish case is decisively stronger as the market
      reacts to the immediate removal of a major blockade, outweighing the gradual
      nature of physical supply recovery.
    key_signals:
    - Resolution of Strait of Hormuz closure/blockade
    - IEA/EIA downgrades of 2026 global oil demand
    - Anticipated supply surge from Gulf production normalisation
