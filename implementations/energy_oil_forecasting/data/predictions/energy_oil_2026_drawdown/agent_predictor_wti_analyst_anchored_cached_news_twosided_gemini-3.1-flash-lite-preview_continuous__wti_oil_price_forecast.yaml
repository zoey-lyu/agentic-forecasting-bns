      Hormuz closure) that has created a massive inventory deficit. While demand concerns
      exist, the physical reality of the supply chain breakdown provides a stronger,
      immediate upside bias compared to the mechanical extrapolation, which cannot
      account for the magnitude of these ongoing disruptions.
    horizon_rationale: The bearish case is that sustained high prices could trigger
      demand destruction and that current OPEC+ quota increases, while currently underperforming,
      signal a collective intention to address tightness. The bullish case, which
      is significantly stronger in the short term, is that the Strait of Hormuz remains
      closed, creating physical supply blockages that continue to drain critical global
      inventories, leading to immediate supply scarcity. The upward pressure from
      the persistent, structural supply disruption outweighs the potential for demand
      softening over this brief window.
    key_signals:
    - Strait of Hormuz closure leading to massive global inventory draws (avg 6.3-7.6
      million bpd)
    - OPEC+ May production at lowest levels since 2000 due to transit blockages
    - Extreme scarcity reflected in OECD inventory levels (lowest since 2003)
    - Diverging demand forecasts (EIA vs OPEC) indicating high uncertainty in price
      elasticity
    - Rising risk of a market 'tipping point' by late June
